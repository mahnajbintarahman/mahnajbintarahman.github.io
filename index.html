<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahnaj Binta Rahman</title>
  <meta name="description" content="CSE student at UIU building toward ML/AI and cybersecurity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f1f3ef; --card: #ffffff; --ink: #172121; --muted: #56615e;
      --line: #cbd3ce; --teal: #0f766e; --accent: #5b3df5; --contour: #b7c4bd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #101615; --card: #182120; --ink: #e8efec; --muted: #9aa8a3;
        --line: #2c3936; --teal: #4fd1c5; --accent: #9b8bff; --contour: #2f4440;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink);
      font: 17px/1.65 "IBM Plex Sans", system-ui, sans-serif; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .wrap { max-width: 68rem; margin: 0 auto; padding: 0 1.5rem; }
    h1, h2, h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; line-height: 1.1; margin: 0; }

    /* Nav */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 0; gap: 1rem; flex-wrap: wrap; }
    nav .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; color: var(--ink); text-decoration: none; }
    nav ul { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
    nav ul a { color: var(--muted); text-decoration: none; }
    nav ul a:hover { color: var(--ink); }

    /* Hero */
    .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 3rem; align-items: center; padding: 3.5rem 0 4.5rem; }
    .hero h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); font-weight: 800; letter-spacing: -0.03em; }
    .hero .role { font-size: 1.25rem; color: var(--teal); font-weight: 500; margin: 1rem 0 .75rem; }
    .hero p.lead { color: var(--muted); max-width: 32rem; margin: 0 0 1.75rem; }
    .btns { display: flex; gap: .75rem; flex-wrap: wrap; }
    .btn { display: inline-block; padding: .7rem 1.3rem; border-radius: 999px; font-weight: 500; text-decoration: none;
      border: 1.5px solid var(--ink); color: var(--ink); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:hover { transform: translateY(-2px); transition: transform .15s; }
    .portrait { position: relative; aspect-ratio: 1; max-width: 26rem; width: 100%; margin-left: auto; }
    .portrait svg { position: absolute; inset: -12%; width: 124%; height: 124%; fill: none; stroke: var(--contour); stroke-width: 1.6; }
    .portrait .photo { position: absolute; inset: 12%; border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%; overflow: hidden;
      background: linear-gradient(135deg, var(--teal), var(--accent)); display: grid; place-items: center;
      color: #fff; font: 800 4rem "Bricolage Grotesque", sans-serif; }
    .portrait .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Sections */
    section { padding: 3.5rem 0; border-top: 1px solid var(--line); }
    section > .wrap > h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 1.75rem; letter-spacing: -0.02em; }
    .about-text { max-width: 44rem; }
    .about-text p { margin: 0 0 1rem; }

    /* Projects */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18.5rem, 1fr)); gap: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .card .shot { aspect-ratio: 16/10; background: linear-gradient(135deg, var(--teal), var(--accent)); display: grid; place-items: center;
      color: rgba(255,255,255,.85); font: 700 1.1rem "Bricolage Grotesque", sans-serif; }
    .card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .body { padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; flex: 1; }
    .card h3 { font-size: 1.3rem; }
    .card p { margin: 0; color: var(--muted); font-size: .97rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: auto; }
    .tag { font-size: .8rem; padding: .15rem .65rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
    .links { display: flex; gap: 1rem; font-weight: 500; }

    /* Skills */
    .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1.75rem; }
    .skills h3 { font-size: 1.1rem; margin-bottom: .7rem; }
    .skills .tags .tag { color: var(--ink); background: var(--card); }

    /* Contact */
    .contact p { max-width: 36rem; color: var(--muted); margin: 0 0 1.5rem; }
    footer { padding: 2rem 0 3rem; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; padding-top: 1.5rem; }
      .portrait { margin: 0 auto; max-width: 18rem; order: -1; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn:hover { transform: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="#top" id="brand"></a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <header class="hero" id="top">
      <div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <p class="lead" id="lead"></p>
        <div class="btns">
          <a class="btn primary" href="#projects">See my projects</a>
          <a class="btn" href="#contact">Get in touch</a>
        </div>
      </div>
      <div class="portrait">
        <svg viewBox="0 0 400 400" aria-hidden="true">
          <ellipse cx="200" cy="200" rx="190" ry="165" transform="rotate(-18 200 200)"/>
          <ellipse cx="200" cy="200" rx="170" ry="145" transform="rotate(-10 200 200)"/>
          <ellipse cx="200" cy="200" rx="150" ry="128" transform="rotate(-2 200 200)"/>
          <ellipse cx="200" cy="200" rx="130" ry="112" transform="rotate(8 200 200)"/>
          <ellipse cx="200" cy="200" rx="112" ry="96" transform="rotate(16 200 200)"/>
        </svg>
        <div class="photo" id="photo"></div>
      </div>
    </header>
  </div>

  <section id="about"><div class="wrap">
    <h2>About</h2>
    <div class="about-text" id="about-text"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <h2>Projects</h2>
    <div class="grid" id="projects-grid"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <h2>Skills</h2>
    <div class="skills" id="skills-grid"></div>
  </div></section>

  <section id="contact" class="contact"><div class="wrap">
    <h2>Contact</h2>
    <p id="contact-text"></p>
    <div class="btns" id="contact-links"></div>
  </div></section>

  <footer><div class="wrap" id="footer"></div></footer>

  <script>
    /* ============ EDIT ONLY THIS PART ============ */
    const SITE = {
      name: "Mahnaj Binta Rahman",
      role: "CSE student · ML/AI and cybersecurity",
      lead: "I study Computer Science & Engineering at United International University in Dhaka, and I build software for rovers, health tools, and machine learning.",
      photo: "images/profile.jpg",           // put your photo at this path
      about: [
        "I'm a CSE student at UIU. I'm on the UIU Mars Rover Team, working with both the Science team and the Software and Autonomous team.",
        "I'm preparing for graduate studies in ML/AI and cybersecurity. Add a sentence here about what you're working on right now."
      ],
      projects: [
        {
          title: "mediConnect",
          desc: "Describe what it does, who it helps, and what you built.",
          image: "images/mediconnect.png",   // screenshot path
          tags: ["Add", "your", "tech"],
          github: "https://github.com/mahnajbintarahman/REPO-NAME",
          demo: ""                            // live link, or leave empty
        },
        {
          title: "CGPA Calculator",
          desc: "Describe what it does, who it helps, and what you built.",
          image: "images/cgpa.png",
          tags: ["Add", "your", "tech"],
          github: "https://github.com/mahnajbintarahman/REPO-NAME",
          demo: ""
        },
        {
          title: "UIU Mars Rover Team",
          desc: "Describe your role on the Science and Software/Autonomous teams.",
          image: "images/rover.png",
          tags: ["Rover", "Autonomy"],
          github: "",
          demo: ""
        }
      ],
      skills: {
        "Languages": ["Python", "C++", "JavaScript"],
        "ML / AI": ["Add yours"],
        "Tools": ["Git", "GitHub", "Linux"]
      },
      contactText: "Open to research collaborations, team projects, and conversations about ML and security.",
      links: [
        { label: "GitHub", url: "https://github.com/mahnajbintarahman" },
        { label: "Email", url: "mailto:your@email.com" },
        { label: "LinkedIn", url: "https://www.linkedin.com/in/your-handle" }
      ]
    };
    /* ============ END OF EDIT AREA ============ */

    const $ = id => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
    const initials = SITE.name.split(" ").map(w => w[0]).slice(0, 2).join("");

    function image(src, fallbackText) {
      const img = new Image();
      img.alt = ""; img.loading = "lazy"; img.src = src;
      img.onerror = () => img.replaceWith(document.createTextNode(fallbackText));
      return img;
    }

    document.title = SITE.name;
    $("brand").textContent = SITE.name.split(" ")[0];
    $("name").textContent = SITE.name;
    $("role").textContent = SITE.role;
    $("lead").textContent = SITE.lead;
    const photoImg = image(SITE.photo, initials); photoImg.alt = "Portrait of " + SITE.name;
    $("photo").appendChild(photoImg);
    SITE.about.forEach(t => $("about-text").appendChild(el("p", "", t)));

    SITE.projects.forEach(p => {
      const card = el("article", "card");
      const shot = el("div", "shot");
      const img = image(p.image, p.title); img.alt = p.title + " screenshot";
      shot.appendChild(img);
      const body = el("div", "body");
      body.appendChild(el("h3", "", p.title));
      body.appendChild(el("p", "", p.desc));
      const links = el("div", "links");
      [["Code", p.github], ["Live demo", p.demo]].forEach(([label, url]) => {
        if (!url) return;
        const a = el("a", "", label); a.href = url; a.target = "_blank"; a.rel = "noopener";
        links.appendChild(a);
      });
      if (links.children.length) body.appendChild(links);
      const tags = el("div", "tags");
      p.tags.forEach(t => tags.appendChild(el("span", "tag", t)));
      body.appendChild(tags);
      card.append(shot, body);
      $("projects-grid").appendChild(card);
    });

    Object.entries(SITE.skills).forEach(([group, items]) => {
      const box = el("div"); box.appendChild(el("h3", "", group));
      const tags = el("div", "tags");
      items.forEach(i => tags.appendChild(el("span", "tag", i)));
      box.appendChild(tags); $("skills-grid").appendChild(box);
    });

    $("contact-text").textContent = SITE.contactText;
    SITE.links.forEach((l, i) => {
      const a = el("a", "btn" + (i === 0 ? " primary" : ""), l.label); a.href = l.url;
      if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
      $("contact-links").appendChild(a);
    });
    $("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
  </script>
</body>
</html>
